name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CI: true
  NODE_ENV: test
  BUN_VERSION: "1.3.11"
  NODE_VERSION: "22.x"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint (CLI)
        run: bun run --filter blade-code lint

      - name: Build
        run: bun run build

      - name: Type check (CLI)
        run: bun run type-check

      - name: Type check (Web)
        run: bun run type-check:web

      - name: Lint (Web)
        run: bun run lint:web

      - name: Test (Web)
        run: bun run test:web

  core-headless-gate:
    name: Headless Core Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Run headless core regression suite
        run: bun run test:headless-core

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Run security tests
        run: bun run --filter blade-code test:security

      - name: Audit dependencies
        run: bun audit --audit-level=critical

  cross-platform-smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test CLI help
        run: bun run --filter blade-code start -- --help

      - name: Test headless help
        run: bun run --filter blade-code start -- --headless /help

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [quality-gate, core-headless-gate]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/cli/package.json') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Configure Chromium sandbox
        shell: bash
        run: |
          sandbox_source="$(find "$HOME/.cache/ms-playwright" \
            -path '*/chromium-*/chrome-linux*/chrome_sandbox' \
            -type f -print -quit)"
          test -n "$sandbox_source"
          sudo install -o root -g root -m 4755 \
            "$sandbox_source" /usr/local/sbin/chrome-devel-sandbox
          echo "CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox" \
            >> "$GITHUB_ENV"

      - name: Build CLI
        run: bun run build:cli

      - name: Verify sandboxed Chromium
        run: bun run --filter blade-code browser:check

      - name: Run tests with coverage
        run: bun run --filter blade-code test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/cli/coverage/lcov.info
          flags: unittests
          name: blade-cli-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/cli/coverage/
          retention-days: 7

  ci-pass:
    name: CI Pass
    if: always()
    needs: [quality-gate, core-headless-gate, coverage, security-tests, cross-platform-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs were cancelled"
            exit 1
          fi
          echo "All CI jobs passed"
