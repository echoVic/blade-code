# 自动发布 Workflow
name: Release and Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.2.3)'
        required: true
        type: string
      release_type:
        description: '发布类型'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
      publish_npm:
        description: '发布到 NPM'
        required: true
        type: boolean
        default: true

env:
  BUN_VERSION: '1.1.34'

jobs:
  # ============================================
  # 1. 验证和预检
  # ============================================
  pre-release-checks:
    name: 发布前检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'bun'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 运行完整测试套件
        run: bun run test:all

      - name: 构建所有包
        run: bun run build

      - name: 运行 ready 检查
        run: bun run ready

      - name: 验证版本号
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            PACKAGE_VERSION=$(cat packages/cli/package.json | jq -r '.version')
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "❌ 标签版本 ($TAG_VERSION) 与 package.json 版本 ($PACKAGE_VERSION) 不匹配"
              exit 1
            fi
            echo "✅ 版本号验证通过: $TAG_VERSION"
          fi

  # ============================================
  # 2. 构建发布产物
  # ============================================
  build-release:
    name: 构建发布产物
    runs-on: ${{ matrix.os }}
    needs: pre-release-checks
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建
        run: bun run build

      - name: 打包产物
        run: |
          cd packages/cli
          tar -czf blade-${{ matrix.os }}.tar.gz dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: blade-${{ matrix.os }}
          path: packages/cli/blade-${{ matrix.os }}.tar.gz
          retention-days: 30

  # ============================================
  # 3. 发布到 NPM
  # ============================================
  publish-npm:
    name: 发布到 NPM
    runs-on: ubuntu-latest
    needs: build-release
    if: ${{ github.event.inputs.publish_npm != 'false' }}
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建
        run: bun run build

      - name: 发布到 NPM
        run: |
          cd packages/cli

          # 根据发布类型添加 tag
          if [[ "${{ github.event.inputs.release_type }}" == "beta" ]]; then
            npm publish --tag beta --access public
          elif [[ "${{ github.event.inputs.release_type }}" == "alpha" ]]; then
            npm publish --tag alpha --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 验证发布
        run: |
          sleep 10
          PUBLISHED_VERSION=$(npm view blade-code version)
          PACKAGE_VERSION=$(cat packages/cli/package.json | jq -r '.version')
          if [[ "$PUBLISHED_VERSION" == "$PACKAGE_VERSION" ]]; then
            echo "✅ NPM 发布成功: blade-code@$PUBLISHED_VERSION"
          else
            echo "⚠️  版本验证失败"
          fi

  # ============================================
  # 4. 创建 GitHub Release
  # ============================================
  github-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, publish-npm]
    if: always() && needs.build-release.result == 'success'
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 生成更新日志
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [[ -z "$PREV_TAG" ]]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 获取版本信息
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Blade Code v${{ steps.version.outputs.version }}

            ### 📦 安装

            ```bash
            npm install -g blade-code@${{ steps.version.outputs.version }}
            # 或
            bun install -g blade-code@${{ steps.version.outputs.version }}
            ```

            ### 📝 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ### 📚 文档

            - [快速开始](https://blade-code.dev/getting-started/quick-start)
            - [配置指南](https://blade-code.dev/configuration/config-system)
            - [完整文档](https://blade-code.dev)

            ### 🐛 问题反馈

            如果遇到问题，请[提交 Issue](https://github.com/echoVic/blade-code/issues)
          files: |
            ./artifacts/blade-ubuntu-latest/blade-ubuntu-latest.tar.gz
            ./artifacts/blade-macos-latest/blade-macos-latest.tar.gz
            ./artifacts/blade-windows-latest/blade-windows-latest.tar.gz
          draft: false
          prerelease: ${{ github.event.inputs.release_type != 'stable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 5. 部署文档
  # ============================================
  deploy-docs:
    name: 部署文档
    runs-on: ubuntu-latest
    needs: github-release
    if: github.event.inputs.release_type == 'stable' || github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          cname: blade-code.dev

  # ============================================
  # 6. 通知
  # ============================================
  notify:
    name: 发布通知
    runs-on: ubuntu-latest
    needs: [publish-npm, github-release]
    if: always()
    timeout-minutes: 5

    steps:
      - name: 发布成功通知
        if: needs.publish-npm.result == 'success' && needs.github-release.result == 'success'
        run: |
          echo "🎉 Blade Code 发布成功！"
          echo "版本: v${{ steps.version.outputs.version }}"
          echo "NPM: https://www.npmjs.com/package/blade-code"
          echo "GitHub: https://github.com/echoVic/blade-code/releases"

      - name: 发布失败通知
        if: needs.publish-npm.result == 'failure' || needs.github-release.result == 'failure'
        run: |
          echo "❌ Blade Code 发布失败"
          echo "请检查日志并手动处理"
          exit 1
